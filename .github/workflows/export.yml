name: Export references

# Run by hand (Actions → Export references → Run workflow) after a review batch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/export.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data images
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: export $(jq length data/refs.json) references"
          git push
